name: Nightly refresh

on:
  schedule:
    - cron: "23 9 * * *"   # 09:23 UTC = 3:23 AM Saskatchewan time, every night
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "data/inbox/**"
      - "data/roster.csv"
      - "config/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions: {}   # nothing by default; the job below gets only what it needs

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit data/swings.csv and site/data.json
      pages: write      # publish to GitHub Pages
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download latest export from WIN Reality
        id: fetch
        # Off until the repo variable AUTO_EXPORT is set to true (Settings > Secrets and variables > Actions > Variables)
        if: github.event_name != 'push' && vars.AUTO_EXPORT == 'true'
        continue-on-error: true
        env:
          WR_EMAIL: ${{ secrets.WR_EMAIL }}
          WR_PASSWORD: ${{ secrets.WR_PASSWORD }}
        run: |
          if [ -z "$WR_EMAIL" ]; then echo "No WR_EMAIL secret; skipping download."; exit 0; fi
          pip install --quiet playwright==1.48.0
          python -m playwright install --with-deps chromium
          python -u scripts/fetch_export.py

      - name: Build dashboard data
        run: python scripts/build_data.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Stamp file versions so browsers load the new CSS/JS/logo right away
        run: sed -i "s/__V__/${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # GitHub sometimes can't find the just-uploaded site bundle for a few seconds
      # ("No artifacts named github-pages"); wait and retry once instead of failing.
      - id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying deploy
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail the run if the automatic export failed (so you get an email)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Automatic export failed. See the 'Download latest export' step log for the error."
          exit 1
